services:
  relabel:
    build: .
    image: relabel-reconcile:local
    ports:
      - "8000:8000"
    environment:
      RELABEL_DB: /data/relabel.sqlite3
      PORT: "8000"
    volumes:
      - relabel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  relabel-data:
